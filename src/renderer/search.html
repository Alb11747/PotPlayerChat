<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Chat - PotPlayer Chat</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' *; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' * data:"
    />
  </head>

  <body class="search-page">
    <div id="search-bootstrap" class="search-input-shell">
      <input
        type="search"
        aria-label="Search messages and usernames"
        placeholder="Search messages and usernames…"
        class="search-input"
        autofocus
      />
      <div role="status">Loading Search…</div>
    </div>
    <main id="app"></main>
    <script type="module" src="/src/search.ts"></script>
  </body>
</html>
